<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100a24">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finder 1X2">
  <meta name="format-detection" content="telephone=no">
  <title>Finder 1X2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23140e24'/%3E%3Crect x='8' y='8' width='48' height='48' rx='12' fill='%23c4a1ff'/%3E%3Ccircle cx='24' cy='28' r='4' fill='%23160e28'/%3E%3Ccircle cx='40' cy='28' r='4' fill='%23160e28'/%3E%3Ccircle cx='24' cy='42' r='4' fill='%23160e28'/%3E%3Ccircle cx='40' cy='42' r='4' fill='%23160e28'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #160e28;
      --text: #f3f0ff;
      --muted: #c8c0ec;
      --faint: #a39bcf;
      --violet: #c4a1ff;
      --border: rgba(155, 120, 230, 0.32);
      --border-soft: rgba(155, 120, 230, 0.18);
      --surface: rgba(28, 20, 48, 0.72);
      --raised: rgba(48, 34, 82, 0.72);
      --teal: #3be08a;
      --red: #ff7a6e;
      --orange: #ff9f43;
      --sign1: #7ad4e6;
      --signx: #e9e4ff;
      --sign2: #ff7a6e;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: var(--sans);
      background: linear-gradient(180deg, #05030d 0%, #100a24 40%, #1c0d33 68%, #05030d 100%);
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    }
    button, input { font: inherit; color: inherit; touch-action: manipulation; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
    .wrap { width: min(640px, 100%); margin: 0 auto; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .brand {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--violet);
    }
    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(30, 21, 52, 0.62);
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }
    .card {
      background: linear-gradient(165deg, rgba(48, 34, 82, 0.78) 0%, rgba(28, 20, 48, 0.86) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(8, 4, 20, 0.28);
      padding: 12px;
      margin-bottom: 12px;
    }
    .entry-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .kicker {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--violet);
    }
    .g-line { display: flex; align-items: baseline; gap: 8px; }
    .g-num {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .range {
      font-family: var(--mono);
      color: var(--faint);
      font-size: 13px;
      font-weight: 700;
    }
    .attuale {
      min-height: 40px;
      border-radius: 12px;
      border: 1px solid var(--violet);
      background: rgba(196, 161, 255, 0.16);
      color: var(--violet);
      font-size: 12px;
      font-weight: 800;
      padding: 8px 10px;
    }
    .match {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 104px;
      gap: 6px;
      align-items: center;
      padding: 6px 0;
    }
    .match + .match { border-top: 1px solid var(--border-soft); }
    .who { display: flex; flex-direction: column; line-height: 1.05; }
    .pk {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--faint);
    }
    .abs {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }
    .controls { display: contents; }
    .signs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .signs button {
      min-height: 48px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: rgba(28, 20, 48, 0.55);
      font-size: 20px;
      font-weight: 800;
      padding: 0;
    }
    .signs button[data-pick="1"] { color: var(--sign1); }
    .signs button[data-pick="X"] { color: var(--signx); }
    .signs button[data-pick="2"] { color: var(--sign2); }
    .signs button[aria-pressed="true"] { color: var(--ink); }
    .signs button[data-pick="1"][aria-pressed="true"] { background: var(--sign1); border-color: var(--sign1); }
    .signs button[data-pick="X"][aria-pressed="true"] { background: var(--signx); border-color: var(--signx); }
    .signs button[data-pick="2"][aria-pressed="true"] { background: var(--sign2); border-color: var(--sign2); }
    .score {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 6px;
      align-items: center;
    }
    .score input {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(48, 34, 82, 0.72);
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      padding: 0;
    }
    .dash { color: var(--faint); font-weight: 700; }
    .tools { display: flex; justify-content: flex-end; margin-top: 4px; }
    .text-btn {
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 122, 110, 0.45);
      background: transparent;
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
    }
    .note {
      margin: 4px 0 8px;
      color: var(--faint);
      font-size: 12px;
    }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 8px 4px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 14px;
    }
    th {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--faint);
    }
    th.c1, td.c1 { color: var(--sign1); }
    th.cx, td.cx { color: var(--signx); }
    th.c2, td.c2 { color: var(--sign2); }
    td.pos, th.pos { text-align: left; color: var(--text); font-weight: 800; }
    tbody tr + tr td { border-top: 1px solid var(--border-soft); }
    td.mag { color: var(--ink); font-weight: 800; border-radius: 8px; }
    td.mag.c1 { background: var(--sign1); }
    td.mag.cx { background: var(--signx); }
    td.mag.c2 { background: var(--sign2); }
    td.min {
      color: var(--orange);
      font-weight: 800;
      box-shadow: inset 0 0 0 1.5px var(--orange);
      background: rgba(255, 159, 67, 0.18);
      border-radius: 8px;
    }
    td.forma {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .through-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 8px 0;
      padding-bottom: 2px;
    }
    .through-list button {
      flex: 0 0 auto;
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(28, 20, 48, 0.55);
      color: var(--text);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.15;
    }
    .through-list button[aria-pressed="true"] {
      background: var(--violet);
      border-color: var(--violet);
      color: var(--ink);
    }
    .through-list .tg { font-weight: 800; font-size: 14px; }
    .through-list .tr { font-family: var(--mono); font-size: 11px; font-weight: 700; opacity: 0.8; }
    .through-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .through-nums {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
      font-weight: 700;
      margin: 2px 0 6px;
    }
    .evo-picks { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px 0; }
    .evo-picks button {
      flex: 0 0 auto;
      min-height: 44px;
      min-width: 44px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(28, 20, 48, 0.55);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      padding: 0 12px;
    }
    .evo-picks button[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); color: var(--ink); }
    .evo-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .evo-table { border-collapse: separate; border-spacing: 0; min-width: 100%; }
    .evo-table .sticky {
      position: sticky;
      left: 0;
      z-index: 1;
      background: #1b1430;
      text-align: left;
      font-weight: 800;
    }
    .evo-table thead .sticky { z-index: 2; }
    .evo-wide { min-width: 520px; }
    td.rose { box-shadow: inset 0 -3px 0 #f3f0ff; }
    .evo-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; }
    .evo-mini { font-family: var(--mono); font-size: 9px; font-weight: 700; color: var(--faint); letter-spacing: -0.02em; }
    .history { display: flex; flex-direction: column; gap: 6px; }
    .day {
      width: 100%;
      display: grid;
      grid-template-columns: 42px repeat(6, minmax(0, 1fr));
      gap: 4px;
      align-items: center;
      padding: 6px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(20, 14, 36, 0.45);
      color: var(--text);
    }
    .day[aria-current="true"] { border-color: var(--violet); background: rgba(196, 161, 255, 0.12); }
    .day-g { font-family: var(--mono); font-size: 12px; font-weight: 800; color: var(--violet); }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .cell .n { font-family: var(--mono); font-size: 9px; color: var(--faint); font-weight: 700; }
    .pill {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
    }
    .pill.s1 { background: var(--sign1); }
    .pill.sX { background: var(--signx); }
    .pill.s2 { background: var(--sign2); }
    .pill.empty { background: transparent; border: 1px dashed var(--border-soft); color: transparent; }
    .menu {
      margin: -4px 0 12px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(20, 14, 36, 0.92);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .menu button, .file-btn {
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(48, 34, 82, 0.72);
      color: var(--text);
      font-weight: 800;
      font-size: 14px;
    }
    .file-btn { display: flex; align-items: center; justify-content: center; }
    .visually-file {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    textarea {
      width: 100%;
      min-height: 120px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(8, 4, 20, 0.45);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 8px;
    }
    .warn { color: var(--orange); font-size: 13px; margin: 0; }
    #modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      align-items: end;
      justify-items: center;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      background: rgba(8, 4, 20, 0.62);
    }
    .modal-card {
      width: min(420px, 100%);
      border-radius: 16px;
      padding: 16px;
      background: linear-gradient(165deg, rgba(48, 34, 82, 0.96), rgba(20, 14, 36, 0.98));
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .modal-card h2 { margin: 0 0 8px; font-size: 20px; }
    .modal-card p { margin: 0; color: var(--muted); }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
    .modal-actions button { flex: 1; min-height: 48px; border-radius: 12px; font-weight: 800; }
    .btn-muted { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-red { background: var(--red); border: 0; color: var(--ink); }
    .import-actions { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <header class="top">
      <div class="brand">Finder 1X2</div>
      <button type="button" class="icon-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">⋯</button>
    </header>
    <section id="menu" class="menu" hidden>
      <button type="button" id="export-btn" data-export>Esporta</button>
      <label class="file-btn" for="import-file">Importa</label>
      <input id="import-file" class="visually-file" type="file" accept="application/json,.json">
      <p id="menu-note" class="warn" hidden></p>
      <div id="import-actions" class="import-actions" hidden></div>
      <textarea id="export-box" readonly hidden aria-label="JSON"></textarea>
      <div id="corrupt-box" hidden>
        <p class="warn">Copia non leggibile. Non l'ho cancellata.</p>
        <button type="button" id="raw-btn">Scarica testo</button>
        <button type="button" class="text-btn" id="discard-btn">Rimuovi testo</button>
      </div>
    </section>
    <section class="card" id="sums">
      <div class="kicker">Somme</div>
      <p class="note" id="sums-note" data-sums-note></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="pos" scope="col">Pos</th>
              <th class="c1" scope="col">1</th>
              <th class="cx" scope="col">X</th>
              <th class="c2" scope="col">2</th>
              <th scope="col">Tot</th>
              <th scope="col">Forma</th>
            </tr>
          </thead>
          <tbody id="sums-body" data-sums-body></tbody>
        </table>
      </div>
    </section>
    <section class="card" id="entry">
      <div class="entry-head">
        <div>
          <div class="kicker">Giornata</div>
          <div class="g-line">
            <div class="g-num" id="g-num" data-giornata>1</div>
            <div class="range" id="range" data-range>1–6</div>
          </div>
        </div>
        <button type="button" class="attuale" id="attuale" data-attuale hidden>Attuale</button>
      </div>
      <div id="rows" data-rows></div>
      <div class="tools">
        <button type="button" class="text-btn" id="delete-btn" data-delete hidden>Elimina</button>
      </div>
    </section>
    <section class="card" id="through-card">
      <div class="kicker">Somme per giornata</div>
      <p class="note" id="through-empty" data-through-empty hidden>Nessuna giornata completa</p>
      <div class="through-list" id="through-list" data-through-list></div>
      <div id="through-detail" data-through-detail hidden>
        <div class="through-head">
          <div class="g-line">
            <div class="g-num" id="through-open" data-through-open></div>
            <div class="range" id="through-range" data-through-range></div>
          </div>
        </div>
        <p class="note" id="through-note" data-through-note></p>
        <div class="through-nums" id="through-nums" data-through-nums></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="pos" scope="col">Pos</th>
                <th class="c1" scope="col">1</th>
                <th class="cx" scope="col">X</th>
                <th class="c2" scope="col">2</th>
                <th scope="col">Tot</th>
                <th scope="col">Forma</th>
              </tr>
            </thead>
            <tbody id="through-body" data-through-body></tbody>
          </table>
        </div>
      </div>
    </section>
    <section class="card" id="evo-card">
      <div class="kicker">Evoluzione</div>
      <div class="evo-picks" id="evo-picks" data-evo-picks></div>
      <p class="note" id="evo-empty" data-evo-empty hidden>Nessuna giornata completa</p>
      <div class="evo-scroll" id="evo-one" data-evo-one hidden>
        <table class="evo-table">
          <thead>
            <tr>
              <th class="sticky" scope="col">G</th>
              <th scope="col">N°</th>
              <th scope="col">Segno</th>
              <th class="c1" scope="col">1</th>
              <th class="cx" scope="col">X</th>
              <th class="c2" scope="col">2</th>
              <th scope="col">Forma</th>
            </tr>
          </thead>
          <tbody id="evo-body" data-evo-body></tbody>
        </table>
      </div>
      <div class="evo-scroll" id="evo-all" data-evo-all hidden>
        <table class="evo-table evo-wide">
          <thead>
            <tr id="evo-all-head"></tr>
          </thead>
          <tbody id="evo-all-body" data-evo-all-body></tbody>
        </table>
      </div>
    </section>
    <section class="card" id="history-card">
      <div class="kicker">Storico</div>
      <div class="history" id="history" data-history></div>
    </section>
  </div>
  <div id="modal" data-modal hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <div class="modal-actions">
        <button type="button" class="btn-muted" id="modal-cancel">Annulla</button>
        <button type="button" class="btn-red" id="modal-confirm">Elimina</button>
      </div>
    </div>
  </div>
  <script>
(function (root, factory) {

  if (root) root.FinderCore = api;

    SIGNS: SIGNS,

        "aria-label": "Gol casa P" + position,
        autocomplete: "off",
        enterkeyhint: "done"
      });
      var away = el("input", {
        type: "text",
        inputmode: "numeric",
        maxlength: "3",
        "data-away": "",
        "aria-label": "Gol ospite P" + position,
        autocomplete: "off",
        enterkeyhint: "done"
      });
      if (match.home != null) home.value = String(match.home);
      if (match.away != null) away.value = String(match.away);
      home.addEventListener("input", onScore);
      away.addEventListener("input", onScore);
      score.appendChild(home);
      score.appendChild(el("span", { class: "dash", "aria-hidden": "true" }, "–"));
      score.appendChild(away);
      controls.appendChild(score);
      row.appendChild(controls);
      rows.appendChild(row);
    }
  }

  function onPick(event) {
    var button = event.currentTarget;
    var row = button.closest("[data-pos]");
    var position = Number(row.getAttribute("data-pos"));
    var ordinal = viewOrdinal();
    if (!apply(ordinal, position, { type: "sign", sign: button.getAttribute("data-pick") })) return;
    render();
  }

  function digits(value) {
    return typeof value === "string" && /^\d{1,3}$/.test(value.trim());
  }

  function onScore(event) {
    var row = event.currentTarget.closest("[data-pos]");
    var home = row.querySelector("[data-home]");
    var away = row.querySelector("[data-away]");
    var pasted = FC.parseScore(home.value);
    if (pasted && away.value.trim() === "") {
      home.value = String(pasted.home);
      away.value = String(pasted.away);
    }
    var position = Number(row.getAttribute("data-pos"));
    var ordinal = viewOrdinal();
    var existing = giornataOf(ordinal);
    var slot = existing ? existing.matches[position - 1] : null;
    var homeText = home.value.trim();
    var awayText = away.value.trim();
    if (homeText === "" && awayText === "") {
      if (slot && slot.home != null) {
        if (!apply(ordinal, position, { type: "clear" })) return;
        render();
      }
      return;
    }
    if (!digits(homeText) || !digits(awayText)) return;
    var homeN = Number(homeText);
    var awayN = Number(awayText);
    if (!apply(ordinal, position, { type: "score", home: homeN, away: awayN })) return;
    if (state.mode === "auto" && viewOrdinal() !== ordinal) render();
    else refreshAround(ordinal);
  }

  function refreshAround(ordinal) {
    paintSums();
    paintThrough();
    paintEvo();
    paintHistory();
    var giornata = giornataOf(ordinal);
    document.querySelectorAll("[data-pos]").forEach(function (row) {
      var position = Number(row.getAttribute("data-pos"));
      var sign = giornata ? giornata.matches[position - 1].sign : null;
      row.querySelectorAll("[data-pick]").forEach(function (button) {
        button.setAttribute("aria-pressed", button.getAttribute("data-pick") === sign ? "true" : "false");
      });
    });
    document.getElementById("delete-btn").hidden = !giornata;
    var live = FC.firstIncomplete(state.document);
    var attuale = document.getElementById("attuale");
    attuale.hidden = ordinal === live;
    attuale.textContent = "Attuale G" + live;
  }

  function sumsNote(result) {
    var text = result.completeCount === 0
      ? "Nessuna giornata completa"
      : result.completeCount === 1
        ? "1 giornata completa"
        : result.completeCount + " giornate complete";
    if (result.partialCount === 1) text += " · 1 aperta non conta";
    else if (result.partialCount > 1) text += " · " + result.partialCount + " aperte non contano";
    return text;
  }

  function paintSums() {
    var result = FC.sums(state.document);
    var note = document.getElementById("sums-note");
    note.textContent = sumsNote(result);
    note.setAttribute("data-complete", String(result.completeCount));
    note.setAttribute("data-partial", String(result.partialCount));
    var body = document.getElementById("sums-body");
    clear(body);
    var showNumbers = result.completeCount > 0;
    result.rows.forEach(function (row) {
      var tr = el("tr", {
        "data-sum-row": String(row.position),
        "data-forma": row.forma
      });
      var head = el("th", { scope: "row", class: "pos" }, "P" + row.position);
      tr.appendChild(head);
      ["1", "X", "2"].forEach(function (sign) {
        var key = sign === "X" ? "X" : sign;
        var td = document.createElement("td");
        td.className = sign === "1" ? "c1" : sign === "X" ? "cx" : "c2";
        td.textContent = showNumbers ? String(row[key]) : "–";
        if (row.majority.indexOf(sign) !== -1) {
          td.className += " mag";
          td.setAttribute("data-majority", sign);
        }
        if (row.minority.indexOf(sign) !== -1) {
          td.className += " min";
          td.setAttribute("data-minority", sign);
        }
        tr.appendChild(td);
      });
      var tot = document.createElement("td");
      tot.textContent = showNumbers ? String(row.totale) : "–";
      tr.appendChild(tot);
      var forma = document.createElement("td");
      forma.className = "forma";
      forma.textContent = showNumbers ? row.forma : "–";
      tr.appendChild(forma);
      body.appendChild(tr);
    });
  }

  function completeOrdinals() {
    return state.document.giornate.filter(function (giornata) {
      return FC.isComplete(giornata);
    }).map(function (giornata) { return giornata.ordinal; }).sort(function (a, b) { return b - a; });
  }

  function selectedThrough(list) {
    if (!list.length) return null;
    if (state.through != null && list.indexOf(state.through) !== -1) return state.through;
    return list[0];
  }

  function fillSumBody(body, rows, rowAttr) {
    clear(body);
    rows.forEach(function (row) {
      var tr = el("tr", {});
      tr.setAttribute(rowAttr, String(row.position));
      tr.setAttribute("data-forma", row.forma);
      tr.appendChild(el("th", { scope: "row", class: "pos" }, "P" + row.position));
      ["1", "X", "2"].forEach(function (sign) {
        var td = document.createElement("td");
        td.className = sign === "1" ? "c1" : sign === "X" ? "cx" : "c2";
        td.textContent = String(row[sign]);
        if (row.majority.indexOf(sign) !== -1) {
          td.className += " mag";
          td.setAttribute("data-majority", sign);
        }
        if (row.minority.indexOf(sign) !== -1) {
          td.className += " min";
          td.setAttribute("data-minority", sign);
        }
        tr.appendChild(td);
      });
      tr.appendChild(el("td", null, String(row.totale)));
      tr.appendChild(el("td", { class: "forma" }, row.forma));
      body.appendChild(tr);
    });
  }

  function paintThrough() {
    var list = completeOrdinals();
    var empty = document.getElementById("through-empty");
    var detail = document.getElementById("through-detail");
    var host = document.getElementById("through-list");
    clear(host);
    if (!list.length) {
      empty.hidden = false;
      detail.hidden = true;
      return;
    }
    empty.hidden = true;
    detail.hidden = false;
    var chosen = selectedThrough(list);
    list.forEach(function (ordinal) {
      var button = el("button", {
        type: "button",
        "data-through": String(ordinal),
        "aria-pressed": ordinal === chosen ? "true" : "false"
      });
      button.appendChild(el("span", { class: "tg" }, "G" + ordinal));
      button.appendChild(el("span", { class: "tr" }, FC.matchNumber(ordinal, 1) + "–" + FC.matchNumber(ordinal, 6)));
      button.addEventListener("click", function () {
        state.through = ordinal;
        paintThrough();
      });
      host.appendChild(button);
    });
    var result = FC.sumsThrough(state.document, chosen);
    document.getElementById("through-open").textContent = "G" + chosen;
    document.getElementById("through-open").setAttribute("data-through-open", String(chosen));
    var range = document.getElementById("through-range");
    range.textContent = result.from + "–" + result.to;
    range.setAttribute("data-through-range", result.from + "-" + result.to);
    var nums = [];
    for (var position = 1; position <= 6; position += 1) nums.push(String(FC.matchNumber(chosen, position)));
    document.getElementById("through-nums").textContent = nums.join(" ");
    var included = result.included.length;
    document.getElementById("through-note").textContent = included === 1
      ? "Dalla giornata 1 · 1 completa"
      : "Dalla giornata 1 alla " + chosen + " · " + included + " complete";
    fillSumBody(document.getElementById("through-body"), result.rows, "data-through-row");
  }

  function countCell(sign, value, line) {
    var td = document.createElement("td");
    td.className = sign === "1" ? "c1" : sign === "X" ? "cx" : "c2";
    td.textContent = String(value);
    td.setAttribute("data-evo-count", sign);
    if (line.majority.indexOf(sign) !== -1) {
      td.className += " mag";
      td.setAttribute("data-majority", sign);
    }
    if (line.minority.indexOf(sign) !== -1) {
      td.className += " min";
      td.setAttribute("data-minority", sign);
    }
    if (line.rose === sign) {
      td.className += " rose";
      td.setAttribute("data-rose", sign);
    }
    return td;
  }

  function paintEvo() {
    var picks = document.getElementById("evo-picks");
    clear(picks);
    ["all", "1", "2", "3", "4", "5", "6"].forEach(function (id) {
      var button = el("button", {
        type: "button",
        "data-evo": id,
        "aria-pressed": state.evo === id ? "true" : "false"
      }, id === "all" ? "Tutte" : "P" + id);
      button.addEventListener("click", function () {
        state.evo = id;
        paintEvo();
      });
      picks.appendChild(button);
    });
    var result = FC.evolution(state.document);
    var empty = document.getElementById("evo-empty");
    var one = document.getElementById("evo-one");
    var all = document.getElementById("evo-all");
    var has = result.positions[0].length > 0;
    empty.hidden = has;
    if (!has) {
      one.hidden = true;
      all.hidden = true;
      return;
    }
    var showAll = state.evo === "all";
    one.hidden = showAll;
    all.hidden = !showAll;
    if (!showAll) {
      var lines = result.positions[Number(state.evo) - 1];
      var body = document.getElementById("evo-body");
      clear(body);
      lines.forEach(function (line) {
        var tr = el("tr", { "data-evo-row": String(line.ordinal), "data-forma": line.forma, "data-sign": line.sign, "data-num": String(line.num) });
        tr.appendChild(el("th", { scope: "row", class: "sticky" }, "G" + line.ordinal));
        tr.appendChild(el("td", null, String(line.num)));
        var signCell = document.createElement("td");
        signCell.appendChild(el("span", { class: "pill s" + line.sign }, line.sign));
        tr.appendChild(signCell);
        tr.appendChild(countCell("1", line["1"], line));
        tr.appendChild(countCell("X", line.X, line));
        tr.appendChild(countCell("2", line["2"], line));
        tr.appendChild(el("td", { class: "forma" }, line.forma));
        body.appendChild(tr);
      });
      return;
    }
    var head = document.getElementById("evo-all-head");
    clear(head);
    head.appendChild(el("th", { class: "sticky", scope: "col" }, "G"));
    for (var position = 1; position <= 6; position += 1) head.appendChild(el("th", { scope: "col" }, "P" + position));
    var grid = document.getElementById("evo-all-body");
    clear(grid);
    result.positions[0].forEach(function (sample, index) {
      var tr = el("tr", { "data-evo-grid": String(sample.ordinal) });
      tr.appendChild(el("th", { scope: "row", class: "sticky" }, "G" + sample.ordinal));
      for (var p = 1; p <= 6; p += 1) {
        var line = result.positions[p - 1][index];
        var td = document.createElement("td");
        td.setAttribute("data-evo-cell", sample.ordinal + "-" + p);
        var box = el("span", { class: "evo-cell" });
        box.appendChild(el("span", { class: "pill s" + line.sign }, line.sign));
        box.appendChild(el("span", { class: "evo-mini", "data-evo-mini": "" }, line["1"] + "·" + line.X + "·" + line["2"]));
        td.appendChild(box);
        tr.appendChild(td);
      }
      grid.appendChild(tr);
    });
  }

  function paintHistory() {
    var root = document.getElementById("history");
    clear(root);
    var current = viewOrdinal();
    var list = state.document.giornate.slice().sort(function (a, b) { return b.ordinal - a.ordinal; });
    list.forEach(function (giornata) {
      var button = el("button", {
        type: "button",
        class: "day",
        "data-history": String(giornata.ordinal)
      });
      if (giornata.ordinal === current) button.setAttribute("aria-current", "true");
      button.appendChild(el("span", { class: "day-g" }, "G" + giornata.ordinal));
      giornata.matches.forEach(function (match) {
        var cell = el("span", { class: "cell" });
        cell.appendChild(el("span", { class: "n" }, String(FC.matchNumber(giornata.ordinal, match.position))));
        var pillClass = "pill " + (match.sign ? "s" + match.sign : "empty");
        cell.appendChild(el("span", { class: pillClass }, match.sign || ""));
        button.appendChild(cell);
      });
      button.addEventListener("click", function () {
        state.mode = "manual";
        state.manual = giornata.ordinal;
        render();
        document.getElementById("entry").scrollIntoView({ block: "start" });
      });
      root.appendChild(button);
    });
  }

  function render() {
    if (state.corruptRaw != null) return;
    paintEntry();
    paintSums();
    paintThrough();
    paintEvo();
    paintHistory();
  }

  function askDelete() {
    var ordinal = viewOrdinal();
    if (!giornataOf(ordinal)) return;
    state.modalOrdinal = ordinal;
    document.getElementById("modal-title").textContent = "Eliminare la giornata " + ordinal + "?";
    document.getElementById("modal-body").textContent = "Esce dalle somme. Le altre giornate restano.";
    document.getElementById("modal").hidden = false;
    document.getElementById("app").setAttribute("inert", "");
    document.getElementById("modal-cancel").focus();
  }

  function closeModal(confirm) {
    var ordinal = state.modalOrdinal;
    document.getElementById("modal").hidden = true;
    document.getElementById("app").removeAttribute("inert");
    state.modalOrdinal = null;
    if (!confirm || ordinal == null) return;
    var result = FC.deleteGiornata(state.document, ordinal);
    if (!result.ok || !persist(result.document)) return;
    state.mode = "auto";
    state.manual = null;
    render();
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime || "application/json" });
    var url = URL.createObjectURL(blob);
    var link = el("a", { href: url, download: filename });
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function showExport() {
    var exported = FC.toExport(state.document, new Date().toISOString());
    if (!exported.ok) {
      setMenuNote(exported.errors[0].message);
      return;
    }
    var box = document.getElementById("export-box");
    box.hidden = false;
    box.value = exported.text;
    download(exported.filename, exported.text);
  }

  function renderImport(fileName) {
    var box = document.getElementById("import-actions");
    clear(box);
    box.hidden = false;
    var pending = state.pendingImport;
    box.appendChild(el("p", { class: "note" }, fileName + ": " + pending.document.giornate.length + " giornate. Nulla è stato cambiato."));
    var merge = el("button", { type: "button" }, "Unisci");
    merge.addEventListener("click", function () {
      var merged = FC.mergeDocuments(state.document, pending.document);
      if (!merged.ok || !persist(merged.document)) return;
      state.pendingImport = null;
      box.hidden = true;
      var added = merged.added.length;
      var skipped = merged.skipped.length;
      setMenuNote((added === 1 ? "Aggiunta 1 giornata." : "Aggiunte " + added + " giornate.") + (skipped ? " " + skipped + " già presenti." : ""));
      state.mode = "auto";
      render();
    });
    var replace = el("button", { type: "button", class: "text-btn" }, "Sostituisci");
    replace.addEventListener("click", function () {
      var current = state.document.giornate.length;
      if (current && !window.confirm("Sostituire le " + current + " giornate di questo browser?")) return;
      if (!persist(pending.document)) return;
      state.pendingImport = null;
      box.hidden = true;
      setMenuNote("Archivio sostituito.");
      state.mode = "auto";
      render();
    });
    box.appendChild(merge);
    box.appendChild(replace);
  }

  function boot() {
    if (!FC) throw new Error("nucleo");
    var loaded;
    try { loaded = FC.loadFromStorage(window.localStorage); }
    catch (error) { loaded = { ok: false, unavailable: true }; }
    if (!loaded.ok && loaded.unavailable) {
      state.volatile = true;
      state.document = FC.emptyDocument();
      setMenuNote("Questo browser non conserva i dati.");
      openMenu();
    } else if (!loaded.ok) {
      state.corruptRaw = loaded.raw || "";
      state.document = FC.emptyDocument();
      document.getElementById("entry").hidden = true;
      document.getElementById("sums").hidden = true;
      document.getElementById("through-card").hidden = true;
      document.getElementById("evo-card").hidden = true;
      document.getElementById("history-card").hidden = true;
      document.getElementById("corrupt-box").hidden = false;
      openMenu();
    } else {
      state.document = loaded.document;
      render();
    }
    document.getElementById("menu-btn").addEventListener("click", function () {
      var menu = document.getElementById("menu");
      menu.hidden = !menu.hidden;
      document.getElementById("menu-btn").setAttribute("aria-expanded", menu.hidden ? "false" : "true");
    });
    document.getElementById("attuale").addEventListener("click", function () {
      state.mode = "auto";
      state.manual = null;
      render();
    });
    document.getElementById("delete-btn").addEventListener("click", askDelete);
    document.getElementById("modal-cancel").addEventListener("click", function () { closeModal(false); });
    document.getElementById("modal-confirm").addEventListener("click", function () { closeModal(true); });
    document.addEventListener("keydown", function (event) {
      if (document.getElementById("modal").hidden) return;
      if (event.key === "Escape") closeModal(false);
    });
    document.getElementById("export-btn").addEventListener("click", showExport);
    document.getElementById("import-file").addEventListener("change", function (event) {
      var file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      if (state.corruptRaw != null) {
        setMenuNote("Prima rimuovi il testo illeggibile.");
        return;
      }
      var reader = new FileReader();
      reader.onload = function () {
        var parsed = FC.parseImportText(String(reader.result || ""));
        if (!parsed.ok) {
          state.pendingImport = null;
          document.getElementById("import-actions").hidden = true;
          setMenuNote(parsed.errors[0].message + " I dati attuali restano.");
          return;
        }
        state.pendingImport = parsed;
        setMenuNote("");
        renderImport(file.name || "file");
      };
      reader.readAsText(file);
    });
    document.getElementById("raw-btn").addEventListener("click", function () {
      if (state.corruptRaw != null) download("carmela-finder-1x2-illeggibile.txt", state.corruptRaw, "text/plain");
    });
    document.getElementById("discard-btn").addEventListener("click", function () {
      if (!window.confirm("Rimuovere il testo illeggibile da questo browser?")) return;
      var cleared = FC.clearStorage(window.localStorage);
      if (!cleared.ok) return;
      state.corruptRaw = null;
      state.document = cleared.document;
      document.getElementById("entry").hidden = false;
      document.getElementById("sums").hidden = false;
      document.getElementById("through-card").hidden = false;
      document.getElementById("evo-card").hidden = false;
      document.getElementById("history-card").hidden = false;
      document.getElementById("corrupt-box").hidden = true;
      setMenuNote("");
      render();
    });
    document.body.setAttribute("data-ready", "true");
  }

  try { boot(); }
  catch (error) {
    console.error(error);
  }
}());

  </script>
</body>
</html>
